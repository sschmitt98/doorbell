name: Test PRs

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build
        run: ./gradlew classes

      - name: Test
        run: ./gradlew check
